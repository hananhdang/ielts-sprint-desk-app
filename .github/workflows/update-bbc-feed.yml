name: Update listening feed caches

on:
  workflow_dispatch:
  schedule:
    # 05:20 Asia/Shanghai (GitHub Actions cron uses UTC).
    - cron: "20 21 * * *"

permissions:
  contents: write

concurrency:
  group: update-listening-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh CGTN feed cache
        run: python scripts/update_cgtn_feed.py

      - name: Refresh BBC backup feed cache
        continue-on-error: true
        run: python scripts/update_bbc_feed.py

      - name: Commit updated episodes
        shell: bash
        run: |
          if git diff --quiet -- cgtn-feed.json bbc-feed.json; then
            echo "Listening feeds are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cgtn-feed.json bbc-feed.json
          git commit -m "Update listening feed caches"
          git push
